      operationId: listEvents
      summary: List ECK events in a namespace
      description: |
        Returns Kubernetes events filtered to those involving ECK-managed resource kinds
        (Elasticsearch, Kibana, etc.), sorted by last timestamp descending.
      tags: [events]
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
