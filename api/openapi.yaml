openapi: 3.0.3
info:
  title: ECK UI API
  description: |
    REST API for the ECK UI web console. Provides authentication, session management,
    and CRUD operations for all Elastic Cloud on Kubernetes (ECK) custom resources.
  version: "1.0.0"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /api/v1
    description: API v1 (relative to application root)

tags:
  - name: auth
    description: Authentication and session management
  - name: health
    description: Health and readiness probes
  - name: elasticsearch
    description: Elasticsearch cluster management
  - name: kibana
    description: Kibana instance management
  - name: apmserver
    description: APM Server management
  - name: beat
    description: Beat management (Filebeat, Metricbeat, etc.)
  - name: agent
    description: Elastic Agent management
  - name: logstash
    description: Logstash management
  - name: enterprisesearch
    description: Enterprise Search management
  - name: elasticmapsserver
    description: Elastic Maps Server management
  - name: elasticsearchautoscaler
    description: Elasticsearch Autoscaler management
  - name: stackconfigpolicy
    description: Stack Config Policy management
  - name: events
    description: Kubernetes event retrieval
  - name: watch
    description: Real-time resource watch via SSE

security:
  - cookieAuth: []

paths:
  # ── Health ───────────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: Returns 200 OK if the process is running.
      tags: [health]
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: Returns 200 OK if the Kubernetes API server is reachable.
      tags: [health]
      security: []
      responses:
        "200":
          description: Server is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Kubernetes API server is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Auth ─────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with a Kubernetes bearer token
      description: |
        Validates the provided token against the Kubernetes TokenReview API.
        On success, creates a server-side session and sets the `eck-ui-session` cookie.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful.
          headers:
            Set-Cookie:
              description: Session cookie (`eck-ui-session`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/session:
    get:
      operationId: getSession
      summary: Get current session
      description: Returns the authenticated user's session information.
      tags: [auth]
      responses:
        "200":
          description: Session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: logout
      summary: Log out
      description: Deletes the current session and clears the session cookie.
      tags: [auth]
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: logged_out

  # ── Elasticsearch ────────────────────────────────────────────────────────────
  /elasticsearch:
    get:
      operationId: listElasticsearch
      summary: List Elasticsearch clusters
      tags: [elasticsearch]
