  # ── Watch ────────────────────────────────────────────────────────────────────
  /watch/{type}:
    get:
      operationId: watchResources
      summary: Watch resource changes via SSE
      description: |
        Opens a Server-Sent Events stream that emits real-time watch events
        (ADDED, MODIFIED, DELETED) for the specified resource type.
        Each event is a JSON object with `type` and `object` fields.
      tags: [watch]
      parameters:
        - name: type
          in: path
          required: true
          description: |
            Resource type to watch. One of: elasticsearch, kibana, apmserver, beat,
            agent, logstash, enterprisesearch, elasticmapsserver,
            elasticsearchautoscaler, stackconfigpolicy.
          schema:
            type: string
            enum:
              - elasticsearch
              - kibana
              - apmserver
              - beat
              - agent
              - logstash
              - enterprisesearch
              - elasticmapsserver
              - elasticsearchautoscaler
              - stackconfigpolicy
        - $ref: "#/components/parameters/NamespaceQuery"
      responses:
        "200":
          description: SSE stream of watch events.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/WatchEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  # ── Security Schemes ──────────────────────────────────────────────────────────
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: eck-ui-session
      description: |
        Session cookie set after successful login via `POST /auth/login`.
        The cookie is HTTP-only, Secure, and SameSite=Strict.

  # ── Parameters ────────────────────────────────────────────────────────────────
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      description: Kubernetes namespace.
      schema:
        type: string
        example: elastic-system

    Name:
      name: name
      in: path
      required: true
      description: Resource name.
      schema:
        type: string
        example: my-elasticsearch

    NamespaceQuery:
      name: namespace
      in: query
      required: false
      description: Filter results to a specific namespace. Omit to list across all namespaces.
      schema:
        type: string
        example: elastic-system

  # ── Responses ─────────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 400
            reason: BadRequest
            message: "Invalid request body: expected JSON with 'token' field."

    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 401
            reason: Unauthorized
            message: "Authentication is required to access this resource."

    Forbidden:
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 403
            reason: Forbidden
            message: "You do not have permission to perform this action."

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 404
            reason: NotFound
            message: "The requested resource was not found."

    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 409
            reason: Conflict
            message: "The resource already exists or has been modified."

  # ── Schemas ───────────────────────────────────────────────────────────────────
  schemas:
    LoginRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Kubernetes bearer token to validate.
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6..."

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserInfo"
        session:
          type: string
          description: Session identifier.
          example: "a1b2c3d4e5f6..."

    SessionResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserInfo"
        organization:
          type: string
          description: Active organization name, if set.
          example: "team-platform"
        expiresAt:
          type: string
          format: date-time
          description: Session expiry time (UTC).
          example: "2026-03-04T22:00:00Z"

    UserInfo:
      type: object
      properties:
        username:
          type: string
          description: Kubernetes username from TokenReview.
          example: "system:serviceaccount:default:my-sa"
        uid:
          type: string
          description: Kubernetes user UID.
          example: "12345678-abcd-efgh-ijkl-123456789012"
        groups:
          type: array
          items:
            type: string
          description: Kubernetes group memberships.
          example: ["system:serviceaccounts", "system:authenticated"]
        extra:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Additional user attributes from TokenReview.

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: HTTP status code.
          example: 400
        reason:
          type: string
          description: Machine-readable error code.
          example: BadRequest
        message:
          type: string
          description: Human-readable error description.
          example: "Invalid request body."

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: Health status.
          enum: [ok, ready, unavailable]
          example: ok
        error:
          type: string
          description: Error message (only present when unhealthy).

    Resource:
      type: object
      description: |
        A Kubernetes resource in unstructured format. The exact schema depends on the
        resource type (Elasticsearch, Kibana, etc.). All resources share the standard
        Kubernetes metadata structure.
      properties:
        apiVersion:
          type: string
          description: API group and version.
          example: "elasticsearch.k8s.elastic.co/v1"
        kind:
          type: string
          description: Resource kind.
          example: "Elasticsearch"
        metadata:
          $ref: "#/components/schemas/ResourceMetadata"
        spec:
          type: object
          description: Resource specification (varies by kind).
        status:
          type: object
          description: Resource status (varies by kind, read-only).

    ResourceMetadata:
      type: object
      properties:
        name:
          type: string
          example: "my-elasticsearch"
        namespace:
          type: string
          example: "elastic-system"
        resourceVersion:
          type: string
          description: Kubernetes resource version for optimistic concurrency.
          example: "12345"
        creationTimestamp:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00Z"
        uid:
          type: string
          example: "abcdef12-3456-7890-abcd-ef1234567890"
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string

    ResourceList:
      type: object
      description: Kubernetes-style list of resources.
      properties:
        apiVersion:
          type: string
          example: "v1"
        kind:
          type: string
          example: "List"
        metadata:
          type: object
          properties:
            resourceVersion:
              type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"

    DeleteResponse:
      type: object
      properties:
        status:
          type: string
          example: deleted
        namespace:
          type: string
          example: elastic-system
        name:
          type: string
          example: my-elasticsearch

    WatchEvent:
      type: object
      description: A single watch event delivered via SSE.
      properties:
        type:
          type: string
          enum: [ADDED, MODIFIED, DELETED]
          description: The type of watch event.
        object:
          $ref: "#/components/schemas/Resource"
