name: Release

on:
    push:
        tags:
            - "v*"

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: "web/package-lock.json"

            - name: Build frontend
              run: |
                  cd web
                  npm ci
                  npm run build

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23"
                  cache: true

            - name: Run tests
              run: |
                  go test ./...
                  cd web && npm test -- --run

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    create-release:
        needs: build-and-push
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Generate release notes
              id: release-notes
              run: |
                  # Extract version from tag
                  VERSION=${GITHUB_REF#refs/tags/}

                  # Get changelog section for this version
                  if grep -q "## \[${VERSION#v}\]" CHANGELOG.md; then
                    sed -n "/## \[${VERSION#v}\]/,/## \[/p" CHANGELOG.md | head -n -1 > release-notes.md
                  else
                    echo "Release ${VERSION}" > release-notes.md
                    echo "" >> release-notes.md
                    echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release-notes.md
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  body_path: release-notes.md
                  draft: false
                  prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-helm-chart:
        needs: build-and-push
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Configure Git
              run: |
                  git config user.name "$GITHUB_ACTOR"
                  git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

            - name: Install Helm
              uses: azure/setup-helm@v3
              with:
                  version: v3.13.0

            - name: Update Chart version
              run: |
                  VERSION=${GITHUB_REF#refs/tags/v}
                  sed -i "s/^version:.*/version: ${VERSION}/" deploy/helm/eck-ui/Chart.yaml
                  sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/helm/eck-ui/Chart.yaml

            - name: Package Helm Chart
              run: |
                  helm package deploy/helm/eck-ui -d .helm-packages

            - name: Checkout gh-pages
              uses: actions/checkout@v4
              with:
                  ref: gh-pages
                  path: gh-pages

            - name: Update Helm repository
              run: |
                  cp -f .helm-packages/*.tgz gh-pages/
                  cd gh-pages
                  helm repo index . --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

            - name: Push to gh-pages
              run: |
                  cd gh-pages
                  git add .
                  git commit -m "Release Helm chart ${GITHUB_REF#refs/tags/}"
                  git push
