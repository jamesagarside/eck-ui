---
apiVersion: v1
kind: Namespace
metadata:
  name: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: ui
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: ui
rules:
  # ECK CRD read/write permissions
  - apiGroups:
      - elasticsearch.k8s.elastic.co
    resources:
      - elasticsearches
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - kibana.k8s.elastic.co
    resources:
      - kibanas
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apm.k8s.elastic.co
    resources:
      - apmservers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - agent.k8s.elastic.co
    resources:
      - agents
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - beat.k8s.elastic.co
    resources:
      - beats
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - logstash.k8s.elastic.co
    resources:
      - logstashes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - enterprisesearch.k8s.elastic.co
    resources:
      - enterprisesearches
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - maps.k8s.elastic.co
    resources:
      - elasticmapsservers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - stackconfigpolicy.k8s.elastic.co
    resources:
      - stackconfigpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - autoscaling.k8s.elastic.co
    resources:
      - elasticsearchautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Core resources for status
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - secrets
      - configmaps
      - events
      - namespaces
    verbs:
      - get
      - list
      - watch
  # ConfigMaps for organization metadata
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - update
      - patch
      - delete
    resourceNames:
      - eck-ui-org-*
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eck-ui
subjects:
  - kind: ServiceAccount
    name: eck-ui
    namespace: eck-ui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eck-ui-config
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: ui
data:
  ECK_UI_PORT: "8080"
  ECK_UI_SYSTEM_NAMESPACE: "elastic-system"
  ECK_UI_RATE_LIMIT: "100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eck-ui
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eck-ui
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: eck-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eck-ui
          image: ghcr.io/jamesagarside/eck-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: eck-ui-config
          env:
            - name: ECK_UI_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: eck-ui-secrets
                  key: session-secret
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: ui
---
apiVersion: v1
kind: Secret
metadata:
  name: eck-ui-secrets
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: ui
type: Opaque
stringData:
  # Generate a secure random string for production
  session-secret: "change-me-in-production-use-openssl-rand"
