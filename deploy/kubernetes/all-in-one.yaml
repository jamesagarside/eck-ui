---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/part-of: eck-ui
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
automountServiceAccountToken: true
---
# Admin ServiceAccount — for generating login tokens (make token)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eck-ui-admin
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: admin
---
# Admin ClusterRoleBinding — grants cluster-admin for UI login
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eck-ui-admin
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: eck-ui-admin
    namespace: eck-ui
---
# ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
rules:
  # ECK CRD resources - full access for management UI
  - apiGroups:
      - elasticsearch.k8s.elastic.co
      - kibana.k8s.elastic.co
      - apm.k8s.elastic.co
      - beat.k8s.elastic.co
      - agent.k8s.elastic.co
      - maps.k8s.elastic.co
      - logstash.k8s.elastic.co
      - enterprisesearch.k8s.elastic.co
      - autoscaling.k8s.elastic.co
      - stackconfigpolicy.k8s.elastic.co
    resources:
      - "*"
    verbs:
      - "*"
  # CRD metadata - read-only for dynamic resource discovery
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
  # Core Kubernetes resources - read-only
  - apiGroups:
      - ""
    resources:
      - pods
      - events
      - secrets
      - services
    verbs:
      - get
      - list
      - watch
  # ConfigMaps - read + write for eck-ui-versions management
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
  # Apps API - read-only for operator version detection
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
  # Authentication - token review for auth delegation
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eck-ui
subjects:
  - kind: ServiceAccount
    name: eck-ui
    namespace: eck-ui
---
# Versions ConfigMap - available Elastic Stack versions for the UI dropdown.
# Update via the UI or POST /api/v1/versions/sync, or edit directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eck-ui-versions
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/component: versions
    app.kubernetes.io/managed-by: eck-ui
data:
  versions.json: |
    {
      "defaultVersion": "9.3.1",
      "versions": [
        "9.3.1", "9.3.0",
        "9.2.6", "9.2.5", "9.2.4", "9.2.3", "9.2.2", "9.2.1", "9.2.0",
        "9.1.11", "9.1.10", "9.1.9", "9.1.8", "9.1.7", "9.1.6", "9.1.5", "9.1.4",
        "9.0.9", "9.0.8", "9.0.7",
        "8.19.12", "8.19.11", "8.19.10", "8.19.9", "8.19.8", "8.19.7", "8.19.6", "8.19.5", "8.19.4",
        "8.18.9", "8.18.8", "8.18.7",
        "7.17.30"
      ]
    }
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eck-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eck-ui
    spec:
      serviceAccountName: eck-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: eck-ui
          image: eck-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: eck-ui
