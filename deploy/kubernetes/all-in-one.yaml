---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
    app.kubernetes.io/part-of: eck-ui
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
automountServiceAccountToken: true
---
# ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
rules:
  # ECK CRD resources - full access for management UI
  - apiGroups:
      - elasticsearch.k8s.elastic.co
      - kibana.k8s.elastic.co
      - apm.k8s.elastic.co
      - beat.k8s.elastic.co
      - agent.k8s.elastic.co
      - maps.k8s.elastic.co
      - logstash.k8s.elastic.co
      - enterprisesearch.k8s.elastic.co
      - autoscaling.k8s.elastic.co
      - stackconfigpolicy.k8s.elastic.co
    resources:
      - "*"
    verbs:
      - "*"
  # Core Kubernetes resources - read-only
  - apiGroups:
      - ""
    resources:
      - pods
      - events
      - secrets
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
  # Authentication - token review for auth delegation
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eck-ui
subjects:
  - kind: ServiceAccount
    name: eck-ui
    namespace: eck-ui
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eck-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eck-ui
    spec:
      serviceAccountName: eck-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: eck-ui
          image: eck-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: eck-ui
