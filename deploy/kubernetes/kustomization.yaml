apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: eck-ui

namespace: eck-ui

resources:
  - all-in-one.yaml

# Uncomment to include Ingress
# - ingress.yaml

commonLabels:
  app.kubernetes.io/name: eck-ui
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/jamesagarside/eck-ui
    newTag: latest

# Override configuration values per environment
configMapGenerator:
  - name: eck-ui-config
    behavior: merge
    literals:
      - ECK_UI_PORT=8080
      - ECK_UI_SYSTEM_NAMESPACE=elastic-system
      - ECK_UI_RATE_LIMIT=100

# Secret generator for production
# Uncomment and configure for production deployments
# secretGenerator:
#   - name: eck-ui-secrets
#     behavior: merge
#     literals:
#       - session-secret=${ECK_UI_SESSION_SECRET}
