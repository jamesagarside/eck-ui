---
# Optional Ingress - apply separately when needed
# Update the host and TLS configuration for your environment
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eck-ui
  namespace: eck-ui
  labels:
    app.kubernetes.io/name: eck-ui
  annotations:
    # Uncomment and configure for your ingress controller
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  # ingressClassName: nginx
  rules:
    - host: eck-ui.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eck-ui
                port:
                  name: http
  # tls:
  #   - hosts:
  #       - eck-ui.example.com
  #     secretName: eck-ui-tls
