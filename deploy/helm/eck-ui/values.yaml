replicaCount: 1

image:
  repository: eck-ui
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Admin service account for generating login tokens (make token)
adminServiceAccount:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  # nodePort: 30880  # Set when service.type is NodePort

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: eck-ui.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

config:
  logLevel: info
  sessionSecret: ""
  roleBindingCacheTTL: "30s"

# Install ECKUICluster CRD for multi-cluster management.
# When false, the CRD must be applied manually before enabling multi-cluster.
installCRDs: false

# Multi-cluster configuration. Mode is auto-detected based on CRD presence.
multiCluster:
  # Force disable multi-cluster even when CRD is present.
  # enabled: auto  # auto | true | false
  healthCheck:
    interval: 30
  circuitBreaker:
    failureThreshold: 3
    recoveryTimeout: 30

# Stack versions available in the version dropdown.
# Updated via the UI or by running POST /api/v1/versions/sync.
versions:
  list:
    - "9.3.1"
    - "9.3.0"
    - "9.2.6"
    - "9.2.5"
    - "9.2.4"
    - "9.2.3"
    - "9.2.2"
    - "9.2.1"
    - "9.2.0"
    - "9.1.11"
    - "9.1.10"
    - "9.1.9"
    - "9.1.8"
    - "9.1.7"
    - "9.1.6"
    - "9.1.5"
    - "9.1.4"
    - "9.0.9"
    - "9.0.8"
    - "9.0.7"
    - "8.19.12"
    - "8.19.11"
    - "8.19.10"
    - "8.19.9"
    - "8.19.8"
    - "8.19.7"
    - "8.19.6"
    - "8.19.5"
    - "8.19.4"
    - "8.18.9"
    - "8.18.8"
    - "8.18.7"
    - "7.17.30"

# Deployment templates: pre-configured deployment presets shown in the UI.
# Set enabled: true and customise templates to override the built-in defaults.
deploymentTemplates:
  enabled: false
  templates: []
