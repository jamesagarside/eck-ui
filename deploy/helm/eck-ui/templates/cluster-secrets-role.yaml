{{- /*
  Role and RoleBinding for reading credential Secrets in the ECK UI namespace.
  Required for multi-cluster mode to load workload cluster credentials.
*/ -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "eck-ui.fullname" . }}-cluster-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eck-ui.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "eck-ui.fullname" . }}-cluster-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eck-ui.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "eck-ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "eck-ui.fullname" . }}-cluster-secrets
  apiGroup: rbac.authorization.k8s.io
