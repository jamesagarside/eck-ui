apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "eck-ui.fullname" . }}
  labels:
    {{- include "eck-ui.labels" . | nindent 4 }}
rules:
  # ECK CRD resources - full access for management UI
  - apiGroups:
      - elasticsearch.k8s.elastic.co
      - kibana.k8s.elastic.co
      - apm.k8s.elastic.co
      - beat.k8s.elastic.co
      - agent.k8s.elastic.co
      - maps.k8s.elastic.co
      - logstash.k8s.elastic.co
      - enterprisesearch.k8s.elastic.co
      - autoscaling.k8s.elastic.co
      - stackconfigpolicy.k8s.elastic.co
    resources:
      - "*"
    verbs:
      - "*"
  # CRD metadata - read-only for dynamic resource discovery
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
  # Core Kubernetes resources - read-only
  - apiGroups:
      - ""
    resources:
      - pods
      - events
      - secrets
      - services
    verbs:
      - get
      - list
      - watch
  # Pod logs - read-only for log streaming
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  # ConfigMaps - read + write for eck-ui-versions management
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
  # Apps API - read-only for operator version detection
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
  # Authentication - token review for auth delegation
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  # Authorization - SSAR probes for RBAC role resolution
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectaccessreviews
    verbs:
      - create
  # ECK UI role bindings - read for RBAC resolution
  - apiGroups:
      - ui.elastic.co
    resources:
      - eckuirolebindings
    verbs:
      - get
      - list
      - watch
  # ECK UI cluster management CRD - for multi-cluster mode
  - apiGroups:
      - ui.eck.elastic.co
    resources:
      - eckuiclusters
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  - apiGroups:
      - ui.eck.elastic.co
    resources:
      - eckuiclusters/status
    verbs:
      - get
      - update
