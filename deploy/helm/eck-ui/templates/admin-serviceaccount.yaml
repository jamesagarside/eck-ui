{{- if .Values.adminServiceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eck-ui.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eck-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "eck-ui.fullname" . }}-admin
  labels:
    {{- include "eck-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "eck-ui.fullname" . }}-admin
    namespace: {{ .Release.Namespace }}
{{- end }}
