apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: organizations.ui.elastic.co
  labels:
    {{- include "eck-ui.labels" . | nindent 4 }}
spec:
  group: ui.elastic.co
  names:
    kind: Organization
    listKind: OrganizationList
    plural: organizations
    singular: organization
    shortNames:
      - org
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Organization defines a logical grouping of namespaces and users for the ECK UI.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - displayName
              properties:
                displayName:
                  type: string
                  description: Human-readable name for the organization.
                  minLength: 1
                  maxLength: 256
                namespaces:
                  type: array
                  description: List of Kubernetes namespaces that belong to this organization.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 253
                members:
                  type: array
                  description: Users who are members of this organization and their assigned roles.
                  items:
                    type: object
                    required:
                      - username
                      - role
                    properties:
                      username:
                        type: string
                        description: The username of the organization member.
                        minLength: 1
                      role:
                        type: string
                        description: The role assigned to the member within this organization.
                        enum:
                          - viewer
                          - editor
                          - admin
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase of the organization resource.
                  enum:
                    - Active
                    - Terminating
                namespaceCount:
                  type: integer
                  description: Number of namespaces currently associated with this organization.
                memberCount:
                  type: integer
                  description: Number of members currently in this organization.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Display Name
          type: string
          jsonPath: .spec.displayName
        - name: Namespaces
          type: integer
          jsonPath: .status.namespaceCount
        - name: Members
          type: integer
          jsonPath: .status.memberCount
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
