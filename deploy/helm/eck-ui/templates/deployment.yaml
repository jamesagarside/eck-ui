apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eck-ui.fullname" . }}
  labels:
    {{- include "eck-ui.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "eck-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "eck-ui.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "eck-ui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            - name: ECK_UI_PORT
              value: {{ .Values.config.port | quote }}
            - name: ECK_UI_ALLOWED_ORIGINS
              value: {{ .Values.config.allowedOrigins | quote }}
            - name: ECK_UI_RATE_LIMIT
              value: {{ .Values.config.rateLimit | quote }}
            - name: ECK_UI_SYSTEM_NAMESPACE
              value: {{ .Values.config.systemNamespace | quote }}
            {{- if .Values.config.sessionSecret }}
            - name: ECK_UI_SESSION_SECRET
              value: {{ .Values.config.sessionSecret | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: ECK_UI_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: ECK_UI_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            {{- if .Values.oidc.existingSecret }}
            - name: ECK_UI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret }}
                  key: client-secret
            {{- else if .Values.oidc.clientSecret }}
            - name: ECK_UI_OIDC_CLIENT_SECRET
              value: {{ .Values.oidc.clientSecret | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
